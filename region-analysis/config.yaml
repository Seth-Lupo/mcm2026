# Region Analysis Configuration

# Sampling
sampling:
  n_samples: 20000000        # initial random samples per event
  seed: 67                 # random seed for reproducibility

# Convex Hull (approximate via extreme points)
hull:
  n_directions: 10000       # random directions to find extreme points
  max_points: 1000          # subsample if more valid points than this
  include_axis_extremes: true
  max_dim_exact_volume: 4   # use exact ConvexHull for dims <= this, approx above
  volume_samples: 100000     # Monte Carlo samples for approximate volume (more = accurate)
  fast_volume_dim_threshold: 4  # skip ConvexHull entirely for dims > this (use fast approx)

# Output
output:
  save_vertices: true
  save_centroid: true
  precision: 10             # decimal places for output (max ~15 for float64)

# Backprojection - constraining earlier weeks by later weeks
backprojection:
  method: "lp"              # "lp" (linear program) or "sample" (monte carlo)
  n_redistribution_samples: 1000  # for sample method only
  tolerance: 1e-24          # LP solver tolerance
  bounds_padding: 1e-30      # padding on bounds for numerical stability
  edge_intersection_tol: 1e-30  # tolerance for binary search on edge intersections

# Parallelization
parallel:
  n_workers: 8                # number of CPU workers for parallel tasks
  batch_size: 100             # batch size for parallel vertex verification

# Numerical stability
numerical:
  epsilon: 1e-30            # small value to prevent division by zero
  jitter: 1e-30             # tiny noise added to degenerate point sets
  clamp_probabilities: true # clamp values to [0, 1] after operations
